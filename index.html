<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Web App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for Inter font */
        body {
            font-family: "Inter", sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Firebase Web App</h1>

        <div id="loadingMessage" class="text-blue-600 mb-4">
            Initializing Firebase...
        </div>

        <div id="appContent" class="hidden">
            <p class="text-lg text-gray-700 mb-4">
                Firebase initialized successfully!
            </p>
            <p id="authStatus" class="text-md text-gray-600 mb-2"></p>
            <p id="userIdDisplay" class="text-md text-gray-600"></p>
            <button id="signOutButton" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-300 ease-in-out mt-6">
                Sign Out
            </button>
        </div>

        <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mt-4" role="alert">
            <strong class="font-bold">Error!</strong>
            <span id="errorText" class="block sm:inline"></span>
        </div>
    </div>

    <!-- Firebase SDKs from CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Get elements
        const loadingMessage = document.getElementById('loadingMessage');
        const appContent = document.getElementById('appContent');
        const authStatus = document.getElementById('authStatus');
        const userIdDisplay = document.getElementById('userIdDisplay');
        const signOutButton = document.getElementById('signOutButton');
        const errorMessageDiv = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        let app;
        let auth;

        // Function to display errors
        function displayError(message) {
            errorText.textContent = message;
            errorMessageDiv.classList.remove('hidden');
            loadingMessage.classList.add('hidden');
            appContent.classList.add('hidden');
        }

        // Initialize Firebase on window load
        window.onload = async () => {
            try {
                // Access firebaseConfig from the global Canvas variable
                const firebaseConfigString = typeof __firebase_config !== 'undefined' ? __firebase_config : null;

                if (!firebaseConfigString) {
                    throw new Error("Firebase config not found. Please ensure it's set in .streamlit/secrets.toml or via Canvas globals.");
                }

                const firebaseConfig = JSON.parse(firebaseConfigString);

                // Initialize Firebase
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);

                // Listen for authentication state changes
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        // User is signed in
                        authStatus.textContent = "You are signed in.";
                        userIdDisplay.textContent = `User ID: ${user.uid}`;
                        signOutButton.classList.remove('hidden');
                        loadingMessage.classList.add('hidden');
                        appContent.classList.remove('hidden');
                        errorMessageDiv.classList.add('hidden'); // Hide error if successful
                    } else {
                        // User is signed out or not yet signed in
                        authStatus.textContent = "You are signed out.";
                        userIdDisplay.textContent = "";
                        signOutButton.classList.add('hidden');
                        loadingMessage.classList.add('hidden');
                        appContent.classList.remove('hidden');
                        errorMessageDiv.classList.add('hidden'); // Hide error if successful
                    }
                });

                // Attempt anonymous sign-in if not already signed in
                if (!auth.currentUser) {
                    await signInAnonymously(auth);
                    console.log("Signed in anonymously.");
                }

                // Sign out button event listener
                signOutButton.addEventListener('click', async () => {
                    try {
                        await signOut(auth);
                        console.log("Signed out successfully.");
                    } catch (error) {
                        console.error("Error signing out:", error);
                        displayError(`Error signing out: ${error.message}`);
                    }
                });

            } catch (error) {
                console.error("Firebase initialization failed:", error);
                displayError(`Firebase initialization failed: ${error.message}`);
            }
        };
    </script>
</body>
</html>
