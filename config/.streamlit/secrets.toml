[ollama]
# If using a local Ollama server, you might not need an API key,
# but could specify server URL or model.
# api_url = "http://localhost:11434"
# model = "llama3"

# --- Domain-Specific API Keys (matching api_providers.yml) ---
[alphavantage]
api_key = "YOUR_ALPHAVANTAGE_API_KEY_HERE" # Get from https://www.alphavantage.co/support/#api-key

[coingecko]
# CoinGecko has a free tier that does not require an API key for basic functions.
# If you use a paid plan, put your key here.
api_key = "YOUR_COINGECKO_API_KEY_HERE" 

[newsapi]
api_key = "YOUR_NEWSAPI_API_KEY_HERE" # Get from https://newsapi.org/

[health_api]
api_key = "YOUR_HEALTH_API_KEY_HERE" # Placeholder for a medical API

[legal_api]
api_key = "YOUR_LEGAL_API_KEY_HERE" # Placeholder for a legal API

[academic_api]
api_key = "YOUR_ACADEMIC_API_KEY_HERE" # Placeholder for an education API

[themoviedb]
api_key = "YOUR_THEMOVIEDB_API_KEY_HERE" # Get from https://www.themoviedb.org/documentation/api

[omdbapi]
api_key = "YOUR_OMDBAPI_API_KEY_HERE" # Get from http://www.omdbapi.com/apikey.aspx

[openweathermap]
