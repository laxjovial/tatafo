# data/config.yml

# Global application configuration settings.
# This file defines general parameters, default behaviors, and API defaults.

llm:
  provider: "openai" # Default LLM provider (e.g., "openai", "google", "ollama")
  model_name: "gpt-3.5-turbo" # Default LLM model
  temperature: 0.7 # Default LLM temperature
  max_summary_input_chars: 10000 # Max characters for summarization input

rag:
  chunk_size: 1000 # Default chunk size for document processing
  chunk_overlap: 100 # Default overlap between chunks
  max_query_results_k: 5 # Default number of top results to retrieve from vector store

web_scraping:
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/108.0.0.0 Safari/537.36"
  timeout_seconds: 30 # Default timeout for web requests

# Default user tier and roles for new registrations or unauthenticated access
default_user_tier: "free"
default_user_roles: ["user"]

# --- API Default Providers ---
# Specifies the default API provider to use for each domain.
# These names must match a provider defined in data/api_providers.yml
api_defaults:
  finance: "alphavantage"
  crypto: "coingecko"
  news: "newsapi"
  medical: "health_api" # Example hypothetical
  legal: "legal_data_api" # Example hypothetical
  education: "academic_api" # Example hypothetical
  entertainment: "themoviedb" # Or "omdbapi"
  weather: "openweathermap"
  travel: "amadeus" # Or "bookingcom"
  sports: "thesportsdb"

# Add other global configurations as needed
